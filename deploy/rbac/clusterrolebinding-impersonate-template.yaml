# Template: vincula a permissão de impersonation à identidade que RODA a API.
# Substitua USER_NAME no nome do ClusterRole e no roleRef.
# Ajuste o subject: ServiceAccount (API no cluster) ou User (API com kubeconfig).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: impersonate-USER_NAME
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: impersonate-USER_NAME
subjects:
  # API rodando no cluster:
  - kind: ServiceAccount
    name: k8s-agent
    namespace: default
  # API rodando fora (kubeconfig): use o User do seu context.
  # - kind: User
  #   name: seu-usuario-kubeconfig
  #   apiGroup: rbac.authorization.k8s.io
