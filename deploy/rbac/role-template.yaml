# Template: Role no namespace. Substitua NAMESPACE e ROLE_NAME.
# Define quais recursos/verbs o usuário terá neste namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ROLE_NAME
  namespace: NAMESPACE
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete", "patch"]
  # Adicione mais rules conforme necessário (deployments, services, etc.)
