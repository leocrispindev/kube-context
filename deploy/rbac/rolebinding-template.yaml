# Template: RoleBinding. Substitua NAMESPACE, USER_NAME, ROLE_NAME.
# USER_NAME deve ser exatamente o valor do claim "sub" do JWT.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ROLE_NAME
  namespace: NAMESPACE
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ROLE_NAME
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: USER_NAME
